feature: rag-langchain
version: 0.0.3
specialist: jarvis-rag
description: |
  LangChain-flavored RAG over Bedrock. Replaces the default ai/service.py
  with a LangChain LCEL chain. Use when you want LangSmith observability
  or multi-step chain composition more elaborate than a single agent invoke.

requires_feature: ai

inputs:
  required: [region, app_name, agent_id, kb_id]
  optional:
    langsmith_enabled: "false"

outputs: [chain_provider]

writes_glob: [backend/ai_langchain/**/*]

files:
  always:
    - { src: python/__init__.py.tmpl,        dst: backend/ai_langchain/__init__.py }
    - { src: python/service.py.tmpl,         dst: backend/ai_langchain/service.py }
    - { src: python/chains.py.tmpl,          dst: backend/ai_langchain/chains.py }
    - { src: python/retrievers.py.tmpl,      dst: backend/ai_langchain/retrievers.py }
    - { src: python/tracing.py.tmpl,         dst: backend/ai_langchain/tracing.py }
    - { src: requirements_addendum.txt.tmpl, dst: backend/requirements-langchain.txt }
