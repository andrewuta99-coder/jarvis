feature: pipeline
version: 0.0.3
specialist: jarvis-pipeline
description: |
  Step Functions + S3 inbox + Lambda orchestrators. Lifted from
  CloudMortgage's Alpamayo pipeline. S3 inbox/claimed/done/failed/rejected
  protocol. STOP kill switch. Tier gating (Ultra/Enterprise) with
  rejection.json + email notify.

inputs:
  required: [region, app_name, account_id, task_role_arn]
  optional:
    allowed_tiers: "ultra,enterprise"
    notify_email: ""

outputs: [state_machine_arn, inbox_bucket, claim_lambda_arn]

writes_glob: [iac/pipeline/**/*, lambda/pipeline_*/**/*]

files:
  always:
    - { src: iac/variables.tf.tmpl,            dst: iac/pipeline/variables.tf }
    - { src: iac/inbox_bucket.tf.tmpl,         dst: iac/pipeline/inbox_bucket.tf }
    - { src: iac/state_machine.tf.tmpl,        dst: iac/pipeline/state_machine.tf }
    - { src: iac/lambdas.tf.tmpl,              dst: iac/pipeline/lambdas.tf }
    - { src: iac/iam.tf.tmpl,                  dst: iac/pipeline/iam.tf }
    - { src: iac/outputs.tf.tmpl,              dst: iac/pipeline/outputs.tf }
    - { src: lambda/claim/handler.py.tmpl,     dst: lambda/pipeline_claim/handler.py }
    - { src: lambda/plan/handler.py.tmpl,      dst: lambda/pipeline_plan/handler.py }
    - { src: lambda/gpu_ready/handler.py.tmpl, dst: lambda/pipeline_gpu_ready/handler.py }
    - { src: lambda/finalise/handler.py.tmpl,  dst: lambda/pipeline_finalise/handler.py }
    - { src: lambda/failure/handler.py.tmpl,   dst: lambda/pipeline_failure/handler.py }
