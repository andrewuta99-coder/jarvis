feature: rag-langgraph
version: 0.0.3
specialist: jarvis-rag
description: |
  LangGraph state-machine RAG. Use when reasoning needs explicit state,
  conditional routing, human-in-the-loop approval gates, or long-running
  flows with checkpoints. Persists graph state to DynamoDB.

requires_feature: ai

inputs:
  required: [region, app_name, agent_id, kb_id, table_chat_threads_name]

outputs: [graph_provider]

writes_glob: [backend/ai_langgraph/**/*]

files:
  always:
    - { src: python/__init__.py.tmpl,        dst: backend/ai_langgraph/__init__.py }
    - { src: python/service.py.tmpl,         dst: backend/ai_langgraph/service.py }
    - { src: python/graph.py.tmpl,           dst: backend/ai_langgraph/graph.py }
    - { src: python/state.py.tmpl,           dst: backend/ai_langgraph/state.py }
    - { src: python/checkpointer.py.tmpl,    dst: backend/ai_langgraph/checkpointer.py }
    - { src: requirements_addendum.txt.tmpl, dst: backend/requirements-langgraph.txt }
