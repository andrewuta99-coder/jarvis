feature: gpu
version: 0.0.3
specialist: jarvis-gpu
description: |
  Scale-to-zero EC2 Spot GPU capacity provider for ECS. Lifted from the
  CloudMortgage iac/ecs-gpu pattern. ASG min=0, max=2, desired=0 →
  $0/hr when idle, ~$0.45/hr g5.2xlarge spot only when tasks run.

inputs:
  required: [region, app_name, account_id]
  optional:
    instance_type: g5.2xlarge
    max_size: 2

outputs: [capacity_provider_name, asg_arn, instance_role_arn]

writes_glob: [iac/gpu/**/*, scripts/cluster_association.sh]

files:
  always:
    - { src: iac/variables.tf.tmpl,            dst: iac/gpu/variables.tf }
    - { src: iac/launch_template.tf.tmpl,      dst: iac/gpu/launch_template.tf }
    - { src: iac/asg.tf.tmpl,                  dst: iac/gpu/asg.tf }
    - { src: iac/capacity_provider.tf.tmpl,    dst: iac/gpu/capacity_provider.tf }
    - { src: iac/iam_instance_role.tf.tmpl,    dst: iac/gpu/iam_instance_role.tf }
    - { src: iac/cloudwatch_alarms.tf.tmpl,    dst: iac/gpu/cloudwatch_alarms.tf }
    - { src: iac/outputs.tf.tmpl,              dst: iac/gpu/outputs.tf }
    - { src: scripts/user_data.sh.tmpl,        dst: iac/gpu/user_data.sh }
    - { src: scripts/cluster_association.sh.tmpl, dst: scripts/cluster_association.sh }
